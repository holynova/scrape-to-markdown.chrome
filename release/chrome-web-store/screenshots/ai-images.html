<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrape to Markdown — AI image descriptions</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 1280px; min-height: 800px; overflow: hidden; color: #f7fff8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 15% 15%, #3ab46b 0, transparent 25%), linear-gradient(135deg, #062d19 0%, #0a542e 52%, #0f7440 100%); }
      main { display: grid; grid-template-columns: 1fr 520px; gap: 72px; align-items: center; width: 1280px; height: 800px; padding: 64px 104px; }
      .copy { max-width: 510px; }
      .eyebrow { margin: 0 0 22px; color: #aaf1bf; font-size: 18px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: 0 0 24px; font-size: 56px; line-height: 1.05; letter-spacing: -.045em; }
      p { margin: 0; color: #d7f3df; font-size: 24px; line-height: 1.45; }
      .feature { display: inline-flex; align-items: center; gap: 11px; margin-top: 34px; padding: 12px 16px; border: 1px solid #6fce8d; border-radius: 999px; color: #eefff2; font-size: 17px; font-weight: 650; background: rgba(255, 255, 255, .09); }
      .feature::before { width: 10px; height: 10px; border-radius: 50%; background: #aaf1bf; content: ""; }
      .shot { height: 672px; padding: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.28); border-radius: 28px; background: #e8f6ea; box-shadow: 0 26px 70px rgba(0, 0, 0, .30); }
      .shot img { display: block; width: 100%; height: auto; border-radius: 17px; }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <p class="eyebrow">Scrape to Markdown</p>
        <h1>Add meaningful image descriptions.</h1>
        <p>Use AI-assisted image descriptions when you choose to configure an API key in the extension.</p>
        <span class="feature">Optional AI image descriptions</span>
      </section>
      <section class="shot" aria-label="AI image description options in the extension side panel">
        <img src="../../../docs/assets/screenshot-ai-images.png" alt="AI image description options in the extension side panel" />
      </section>
    </main>
  </body>
</html>
