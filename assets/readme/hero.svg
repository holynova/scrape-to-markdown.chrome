<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">网页转 Markdown Scrape to Markdown — Chrome 侧边栏扩展</title>
  <desc id="desc">深绿底标题：网页转 Markdown；右侧是一张网页卡片经箭头变成 Markdown 代码卡，象征一键把网页转成干净的 Markdown。</desc>

  <rect width="1200" height="360" rx="26" fill="#0d3b26"/>

  <g id="deco" opacity="0.5">
    <circle cx="706" cy="56" r="24" fill="#14532d"/>
    <circle cx="64" cy="326" r="12" fill="#14532d"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#86efac">CHROME 扩展 · SIDE PANEL · 侧边栏</text>
    <text x="56" y="130" font-size="56" font-weight="700" fill="#f0fdf4">网页转 Markdown</text>
    <text x="56" y="170" font-size="22" fill="#bbf7d0">SCRAPE TO MARKDOWN — 一键保存网页为 Markdown</text>
    <text x="56" y="206" font-size="19" fill="#a7d8b5">转 Markdown、批量下图，导出微博、豆瓣与 ChatGPT 对话。</text>
    <g id="chips" font-size="18" fill="#dcfce7" text-anchor="middle">
      <g><rect x="56" y="238" width="92" height="36" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="102" y="262">v1.1.7</text></g>
      <g><rect x="160" y="238" width="158" height="36" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="239" y="262">React 19 + TS</text></g>
      <g><rect x="330" y="238" width="122" height="36" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="391" y="262">中英双语</text></g>
      <g><rect x="464" y="238" width="122" height="36" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="525" y="262">6 大功能</text></g>
    </g>
  </g>

  <g id="convert-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="labels" font-size="18" fill="#bbf7d0" text-anchor="middle">
      <text x="875" y="292">网页 PAGE</text>
      <text x="1065" y="292">Markdown</text>
    </g>
    <g id="web-card">
      <rect x="800" y="64" width="150" height="200" rx="10" fill="#ffffff"/>
      <rect x="812" y="76" width="126" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="812" y="100" width="90" height="10" rx="3" fill="#14532d"/>
      <rect x="812" y="118" width="126" height="7" rx="3" fill="#d1d5db"/>
      <rect x="812" y="132" width="110" height="7" rx="3" fill="#e5e7eb"/>
      <rect x="812" y="150" width="126" height="56" rx="6" fill="#bbf7d0"/>
      <circle cx="830" cy="166" r="7" fill="#22c55e"/>
      <polygon points="812,206 840,176 862,198 878,182 902,206" fill="#16a34a"/>
      <rect x="812" y="216" width="126" height="7" rx="3" fill="#e5e7eb"/>
      <rect x="812" y="230" width="80" height="7" rx="3" fill="#e5e7eb"/>
    </g>
    <g id="arrow" stroke="#86efac" stroke-width="3" stroke-linecap="round">
      <line x1="958" y1="164" x2="982" y2="164"/>
      <polygon points="982,164 972,156 972,172" fill="#86efac" stroke="none"/>
    </g>
    <g id="md-card">
      <rect x="990" y="64" width="150" height="200" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="1002" y="100" width="70" height="10" rx="3" fill="#4ade80"/>
      <rect x="1002" y="122" width="110" height="7" rx="3" fill="#86efac" opacity="0.8"/>
      <rect x="1002" y="136" width="90" height="7" rx="3" fill="#86efac" opacity="0.6"/>
      <rect x="1002" y="158" width="7" height="7" fill="#4ade80"/>
      <rect x="1016" y="158" width="80" height="7" rx="3" fill="#86efac" opacity="0.7"/>
      <rect x="1002" y="180" width="110" height="40" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
      <circle cx="1016" cy="194" r="5" fill="#4ade80"/>
      <polygon points="1002,220 1022,198 1036,210 1048,200 1064,220" fill="#4ade80" opacity="0.8"/>
      <rect x="1002" y="232" width="110" height="7" rx="3" fill="#4ade80" opacity="0.5"/>
    </g>
  </g>
</svg>
